@if (isLoading) {
  <h1 class="text-5xl">Loading .....</h1>
}@else {

  @if (wishListDetails?.count != 0 && !emptyWishList) {

  <section class="wishlist">
    <div class="wishlist__header mb-7 flex justify-between items-center">
      <h2 class="text-3xl font-semibold">
        My Wish List ({{ wishListDetails.count }})
      </h2>
      <div>
        <button (click)="clearWishList()" class="bg-red-500 text-white p-2 rounded-md">
          Clear
        </button>
      </div>
    </div>

    <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
      <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
        <tbody>
          @for (item of wishListDetails?.data; track $index) {
            <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600">
              <td class="p-4">
                <img [src]="item.imageCover" class="w-16 md:w-32 max-w-full max-h-full" alt="Product Image">
              </td>
              <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">
                {{ item.title }}
              </td>
              <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">
                ${{ item.price }}
              </td>
              <td class="px-6 py-4">
                <button (click)="removeItem(item._id)" class="font-medium text-red-600 dark:text-red-500 hover:underline">
                  Remove
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </section>
  } @else {
    <h1 class="text-5xl">No wishlist items .... start shopping now</h1>
  }
}
